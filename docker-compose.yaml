services:
  postgres:
    image: postgres:17
    container_name: pq_container
    environment:
      POSTGRES_DB: plusonedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres_db" ]
      timeout: 10s
      retries: 5
    restart: unless-stopped


volumes:
  postgres_data: